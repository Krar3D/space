<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050814">
    <title>حرب الفضاء - تحدي الاقتصاد</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

        :root {
            --space-bg: #050814;
            --laser-color: #00e5ff;
            --super-laser: #b700ff;
            --damage-color: #ff2a2a;
        }

        * { box-sizing: border-box; }

        html, body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; margin: 0; padding: 0;
            background: var(--space-bg);
            color: white; font-family: 'Tajawal', sans-serif;
            overflow: hidden; overscroll-behavior: none; touch-action: none;
        }

        /* ------------------ خلفية الفضاء والنجوم ------------------ */
        .stars-bg {
            position: absolute; top: -100%; left: 0; width: 100%; height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starsMove 10s linear infinite;
            z-index: 0; opacity: 0.6; transition: all 0.5s ease;
        }
        @keyframes starsMove { 0% { transform: translateY(0); } 100% { transform: translateY(50%); } }
        
        .stars-bg.warp-speed { animation-duration: 0.5s; opacity: 1; filter: blur(1px); }

        /* ------------------ ساحة الفضاء ------------------ */
        .space-arena {
            position: absolute; top: 8%; left: 0; width: 100%; height: 42%;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            z-index: 10;
        }

        /* النيزك / الزعيم */
        .asteroid-wrap {
            position: relative; display: flex; flex-direction: column; align-items: center; z-index: 5;
        }

        .asteroid-container {
            font-size: 5rem; position: relative;
            transition: all 0.3s ease;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
            animation: float 3s ease-in-out infinite;
        }
        .boss-ufo {
            font-size: 6.5rem; filter: drop-shadow(0 0 25px rgba(255, 42, 42, 0.8));
            animation: bossFloat 2s ease-in-out infinite alternate !important;
        }
        @keyframes bossFloat { 0% { transform: translateX(-15px) translateY(0); } 100% { transform: translateX(15px) translateY(10px); } }
        
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(10px) rotate(5deg); } }
        
        .asteroid-explode { animation: explodeAnim 0.5s forwards !important; }
        @keyframes explodeAnim {
            0% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.5); filter: brightness(2) drop-shadow(0 0 50px var(--laser-color)); }
            100% { transform: scale(2); opacity: 0; }
        }

        .asteroid-crash { animation: crashAnim 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        @keyframes crashAnim {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(4) translateY(100px); opacity: 0; }
        }

        /* شريط طاقة الزعيم */
        .boss-hp-wrapper {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 120px; height: 12px; background: rgba(0,0,0,0.8);
            border: 2px solid var(--damage-color); border-radius: 6px;
            overflow: hidden; opacity: 0; transition: opacity 0.5s; z-index: 20;
        }
        .boss-hp-wrapper.show { opacity: 1; }
        .boss-hp-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff0000, #ff7b00);
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* سفينة الفضاء (اللاعب) */
        .spaceship-container {
            font-size: 4rem; position: relative; z-index: 10;
            filter: drop-shadow(0 15px 15px rgba(0, 229, 255, 0.4));
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .spaceship-container.shield-aura {
            filter: drop-shadow(0 0 20px #00e5ff) drop-shadow(0 0 40px #00aaff);
            transform: scale(1.1);
        }

        /* ليزر الإطلاق */
        .laser-beam {
            position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
            width: 6px; height: 0; background: #fff;
            box-shadow: 0 0 15px var(--laser-color), 0 0 30px var(--laser-color);
            border-radius: 5px; opacity: 0; z-index: 5;
        }
        .laser-shoot { animation: shootLaser 0.3s ease-out forwards; }
        @keyframes shootLaser {
            0% { height: 0; opacity: 1; bottom: 100%; }
            50% { height: 150px; opacity: 1; bottom: 150%; }
            100% { height: 50px; opacity: 0; bottom: 300%; }
        }

        .super-laser {
            width: 12px; box-shadow: 0 0 20px var(--super-laser), 0 0 40px var(--super-laser);
            background: #f0f;
        }

        /* مؤثر اهتزاز الشاشة العنيف والتوهج الأحمر */
        @keyframes severeShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 15px) rotate(-2deg); }
            40% { transform: translate(15px, -15px) rotate(2deg); }
            60% { transform: translate(-15px, -15px) rotate(-2deg); }
            80% { transform: translate(15px, 15px) rotate(2deg); }
        }
        .critical-damage-fx { animation: severeShake 0.5s ease-in-out; }
        .damage-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px var(--damage-color);
            background: rgba(255, 0, 0, 0.2);
            z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .damage-overlay.active { opacity: 1; }

        /* ------------------ الواجهة العلوية (HUD) ------------------ */
        .top-hud {
            position: fixed; top: 15px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start; z-index: 1000; pointer-events: none;
            gap: 5px; flex-wrap: wrap;
        }
        .hud-badge {
            padding: 5px 10px; border-radius: 5px; font-weight: 700; font-size: 0.8rem; border: 1px solid rgba(255,255,255,0.3);
            white-space: nowrap; font-family: 'Tajawal', sans-serif;
        }
        .streak-hud {
            background: rgba(0, 229, 255, 0.2); color: var(--laser-color);
            border-color: var(--laser-color); display: none; text-transform: uppercase;
            animation: popIn 0.4s ease-out; box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        .highscore-hud {
            background: rgba(255, 215, 0, 0.15); color: #ffd700;
            border-color: rgba(255, 215, 0, 0.5); box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
        }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ------------------ واجهة الأسئلة والأهداف ------------------ */
        .ui-layer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 100;
            background: rgba(5, 8, 20, 0.95); border-top: 2px solid var(--laser-color);
            padding: 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-radius: 25px 25px 0 0; width: 100%; max-width: 600px; text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.9);
            max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
        }
        .ui-layer::-webkit-scrollbar { width: 5px; } .ui-layer::-webkit-scrollbar-thumb { background: var(--laser-color); border-radius: 5px; }

        .top-tools { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .goal-wrapper { display: flex; align-items: center; gap: 8px; }
        .q-counter { font-size: 0.95rem; color: #fff; font-weight: bold; margin: 0; background: rgba(0, 229, 255, 0.3); padding: 4px 15px; border-radius: 5px; border: 1px solid var(--laser-color); transition: all 0.3s;}
        .difficulty-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 5px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-weight: bold; display: flex; align-items: center; gap: 4px; transition: all 0.3s;}

        .shield-btn { background: #004d98; border: 1px solid #00aaff; padding: 6px 15px; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-family: 'Tajawal', sans-serif;}
        .shield-btn:disabled { background: #333; color: #777; cursor: default; border-color: #555;}
        .shield-btn.active-glow { box-shadow: 0 0 15px #00aaff; border: 1px solid #fff; background: #0077ff;}

        .timer-container { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 15px; }
        .timer-bar { height: 100%; width: 100%; background: var(--laser-color); transition: width 1s linear, background 0.3s; }
        .timer-warning { background: var(--damage-color) !important; box-shadow: 0 0 10px var(--damage-color); }

        h2 { margin: 0 0 20px 0; color: #fff; font-size: 1.1rem; line-height: 1.5; }
        
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        @media (max-width: 480px) { .options { grid-template-columns: 1fr; } }
        
        button.opt-btn { 
            background: rgba(255, 255, 255, 0.05); color: white; 
            border: 1px solid rgba(255,255,255,0.2); padding: 12px; 
            border-radius: 8px; font-size: 0.95rem; font-family: 'Tajawal', sans-serif; 
            cursor: pointer; transition: all 0.2s; text-align: center; font-weight: bold;
        }
        button.opt-btn:active { transform: scale(0.95); }
        button.opt-btn:disabled { opacity: 0.7; cursor: default; transform: none; }

        .speech-bubble { background: #fff; color: #000; padding: 6px 15px; border-radius: 5px; font-size: 0.95rem; font-weight: 900; margin: 0 auto 15px auto; display: none; opacity: 0; transition: opacity 0.3s; width: fit-content; text-transform: uppercase; }

        #explanation-box { display: none; margin-top: 15px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 8px; border: 1px solid var(--laser-color); animation: fadeIn 0.4s; text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        #explanation-box h3 { margin: 0 0 10px 0; font-size: 1.1rem; }
        #explanation-box p { margin: 0 0 15px 0; font-size: 0.9rem; line-height: 1.6; color: #e2e8f0; }

        #next-btn { background: var(--laser-color); color: #000; font-weight: 900; width: 100%; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; }

        /* شاشات النهاية والمراجعة */
        #completion-screen, #review-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,8,20,0.98);
            z-index: 200; padding: 30px 20px; text-align: center; display: none; overflow-y: auto;
        }
        
        .trophy { font-size: 4rem; margin: 0; filter: drop-shadow(0 0 20px rgba(0,229,255,0.8)); position: relative; z-index: 201;}
        .score-text { font-size: 2.5rem; margin: 10px 0; font-weight: 900; letter-spacing: 2px; position: relative; z-index: 201; color: #fff;}
        #final-desc { font-size: 1rem; color: #aaa; margin-bottom: 25px; line-height: 1.5; position: relative; z-index: 201;}
        
        .action-btns { display: flex; flex-direction: column; gap: 12px; max-width: 300px; margin: 0 auto; position: relative; z-index: 201;}
        .action-btns button { border: none; font-weight: bold; color: #000; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 1.1rem; text-transform: uppercase;}
        .btn-restart { background: #fff; }
        .btn-review { background: var(--laser-color); color: #000;}

        .review-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); text-align: right; }
        .review-q { font-weight: bold; color: #fff; margin-bottom: 10px; font-size: 1rem; line-height: 1.4; }
        .review-ans { font-size: 0.95rem; margin-bottom: 8px; }
        .ans-correct { background: rgba(0, 229, 255, 0.2); color: var(--laser-color); padding: 2px 6px; border-radius: 4px; }
        .ans-wrong { background: rgba(255, 42, 42, 0.2); color: var(--damage-color); padding: 2px 6px; border-radius: 4px; }
        .review-exp { font-size: 0.85rem; color: #aaa; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        
    </style>
</head>
<body>

    <div class="stars-bg" id="stars-bg"></div>
    <div class="damage-overlay" id="damage-overlay"></div>

    <div class="top-hud">
        <div class="hud-badge highscore-hud" id="highscore-badge">🎖️ أفضل مهمة: 0</div>
        <div class="hud-badge streak-hud" id="streak-badge">🔥 كومبو: 2</div>
    </div>

    <div class="space-arena">
        <div class="asteroid-wrap">
            <div class="boss-hp-wrapper" id="boss-hp-wrapper">
                <div class="boss-hp-fill" id="boss-hp-fill"></div>
            </div>
            <div class="asteroid-container" id="asteroid">🪨</div>
        </div>
        <div class="spaceship-container" id="spaceship">
            🚀
            <div class="laser-beam" id="laser"></div>
        </div>
    </div>

    <div class="ui-layer" id="ui-container">
        <div id="quiz-content">
            <div class="top-tools">
                <div class="goal-wrapper">
                    <div class="q-counter" id="q-counter">الهدف 1 / 3</div>
                    <div class="difficulty-badge" id="difficulty-badge">🟡 متوسط</div>
                </div>
                <button class="shield-btn" id="shield-btn" onclick="activateShield()">🛡️ تفعيل الدرع (1)</button>
            </div>
            
            <div class="timer-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>

            <h2 id="question-text">جاري التحميل...</h2>
            
            <div class="speech-bubble" id="speech-bubble"></div>

            <div class="options" id="options-container"></div>
            
            <div id="explanation-box">
                <h3 id="result-title"></h3>
                <p id="explanation-text"></p>
                <button id="next-btn" onclick="moveToNext()">الهدف التالي 🌌</button>
            </div>
        </div>
    </div>

    <div id="completion-screen">
        <div class="trophy" id="final-trophy">🎖️</div>
        <h2 id="final-praise" style="font-size: 2rem; margin: 15px 0;">جاري تقييم المهمة...</h2>
        <p id="final-desc">جاري التقييم...</p>
        <div class="score-text" id="final-score">النقاط: 0</div>
        <div class="action-btns">
            <button class="btn-review" onclick="showReview()">تقرير المهمة 📋</button>
            <button class="btn-restart" onclick="startFresh()">مهمة جديدة 🔄</button>
        </div>
    </div>

    <div id="review-screen">
        <h2 style="text-align: center; color: #fff; margin-bottom: 20px;">تقرير الأهداف</h2>
        <div id="review-list"></div>
        <button class="btn-restart" style="width: 100%; margin-top: 15px; padding: 15px;" onclick="startFresh()">إنهاء التقرير</button>
    </div>

    <script>
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const gainNode = audioCtx.createGain();
            gainNode.connect(audioCtx.destination);
            
            if (type === 'laser') { 
                let osc = audioCtx.createOscillator();
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'super-laser') { 
                let osc = audioCtx.createOscillator();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.5);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'explosion') { 
                let osc = audioCtx.createOscillator();
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(100, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.5); 
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'shield') {
                let osc = audioCtx.createOscillator();
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'tick') {
                let osc = audioCtx.createOscillator();
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'bossHit') {
                let osc = audioCtx.createOscillator();
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4); 
                gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
                osc.connect(gainNode); osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // الأسئلة الـ 6 المأخوذة من صور الامتحان
        let quizData = [
            { q: "يتحقق التوازن للمنتج عندما:", options: ["ميل منحنى الناتج يساوي ميل خط التكاليف", "MPL / MPK = W / r", "خط التكاليف يمس منحنى الناتج المتساوي", "كل ما سبق."], correct: 3, explanation: "التوازن يتحقق عند نقطة التماس حيث تتساوى الميول هندسياً ورياضياً.", difficulty: "صعب" },
            { q: "إذا كان سعر العمل فقط متغيراً، فأن خط الإنتاج (خط التوسع) يكون:", options: ["مستقيم", "عمودي", "أفقي", "متعرج"], correct: 3, explanation: "تغير سعر أحد عناصر الإنتاج يؤدي إلى تغير النسبة المثلى لمزج العناصر، مما يجعل مسار التوسع غير مستقيم (متعرج).", difficulty: "متوسط" },
            { q: "التكاليف التي تدفعها المنشأة فعلياً مقابل خدمات عناصر الإنتاج (مثل الأجور والمواد الخام) تُسمى:", options: ["تكاليف ضمنية.", "تكاليف الفرصة البديلة.", "تكاليف صريحة.", "تكاليف غير ملموسة."], correct: 2, explanation: "التكاليف الصريحة هي المدفوعات النقدية الفعلية التي تدفعها المنشأة لموردي عناصر الإنتاج.", difficulty: "متوسط" },
            { q: "نقطة التوازن (التماس) التي تمثل أقل تكلفة لإنتاج كمية معينة، تتحقق عندما:", options: ["يتقاطع خط الكلفة مع منحنى الناتج المتساوي في نقطتين.", "يقطع خط الكلفة محور العمل فقط.", "يلامس خط الكلفة منحنى الناتج المتساوي.", "يكون خط الكلفة أفقياً تماماً."], correct: 2, explanation: "عند نقطة التماس (المماسة) يكون ميل خط التكلفة مساوياً لميل منحنى الناتج المتساوي، وهي نقطة تدنية التكاليف.", difficulty: "متوسط" },
            { q: "إذا كانت دالة الإنتاج غير متجانسة ونسب بين عنصري العمل وراس المال مضطربة، فأن خط الإنتاج (خط التوسع) يكون:", options: ["مستقيم", "عمودي", "أفقي", "متعرج"], correct: 3, explanation: "في دوال الإنتاج غير المتجانسة، تتغير النسبة بين العمل ورأس المال مع زيادة الإنتاج، مما يجعل خط التوسع متعرجاً أو منحنياً.", difficulty: "صعب" },
            { q: "إذا استخدم صاحب المصنع مستودع مملوك له لتخزين بضاعته بدلاً من تأجيره، فإن الإيجار الضائع يُعتبر:", options: ["تكلفة صريحة.", "تكلفة ضمنية.", "ربحاً صافياً للمؤسسة.", "مصاريف إدارية."], correct: 1, explanation: "التكلفة الضمنية (أو تكلفة الفرصة البديلة) تمثل العائد الذي يضحي به المالك عند استخدام موارده الذاتية بدلاً من تأجيرها للغير.", difficulty: "متوسط" }
        ];

        const happyReplies = ["إصابة دقيقة! 🎯", "تم تدمير الهدف! 💥", "ليزر قاتل! 🔫", "عاش الكابتن! 🚀", "المنطقة آمنة! ✨"];
        const sadReplies = ["درع السفينة تضرر! ⚠️", "النيزك ضربنا! ☄️", "تحذير: أضرار جسيمة! 🚨", "فقدنا السيطرة! 💥"];

        let currentQ = 0; let score = 0; let streak = 0; let userAnswers = [];
        let timeLeft = 30; let maxTime = 30; let timerInterval; let tickInterval;
        let isShieldAvailable = true; let isShieldActive = false;
        
        let currentBossHits = 0;

        let highScore = localStorage.getItem('spaceQuizRPG') || 0;
        document.getElementById('highscore-badge').innerText = `🎖️ أفضل مهمة: ${highScore}`;

        const bubble = document.getElementById('speech-bubble'); const streakBadge = document.getElementById('streak-badge');
        const qText = document.getElementById('question-text'); const optsContainer = document.getElementById('options-container');
        const expBox = document.getElementById('explanation-box'); const resTitle = document.getElementById('result-title');
        const expText = document.getElementById('explanation-text'); const nextBtn = document.getElementById('next-btn');
        const timerBar = document.getElementById('timer-bar'); const uiContainer = document.getElementById('ui-container');
        const asteroid = document.getElementById('asteroid'); const laser = document.getElementById('laser');
        const damageOverlay = document.getElementById('damage-overlay'); const starsBg = document.getElementById('stars-bg');
        const spaceship = document.getElementById('spaceship'); const shieldBtn = document.getElementById('shield-btn');
        const bossHpWrapper = document.getElementById('boss-hp-wrapper'); const bossHpFill = document.getElementById('boss-hp-fill');
        const qCounter = document.getElementById('q-counter'); const diffBadge = document.getElementById('difficulty-badge');

        function activateShield() {
            if (isShieldAvailable && !isShieldActive) {
                playSound('shield');
                isShieldActive = true;
                isShieldAvailable = false;
                shieldBtn.innerText = "🛡️ درع مُفعل!";
                shieldBtn.classList.add('active-glow');
                shieldBtn.disabled = true;
                spaceship.classList.add('shield-aura'); 
            }
        }

        function startFresh() {
            document.body.classList.remove('critical-damage-fx');
            damageOverlay.classList.remove('active');
            starsBg.classList.remove('warp-speed');
            document.getElementById('completion-screen').style.display = 'none';
            document.getElementById('review-screen').style.display = 'none';
            document.getElementById('quiz-content').style.display = 'block';
            
            currentQ = 0; score = 0; streak = 0; userAnswers = []; currentBossHits = 0;
            isShieldAvailable = true; isShieldActive = false;
            bossHpFill.style.width = '100%';
            shieldBtn.innerText = "🛡️ تفعيل الدرع (1)";
            shieldBtn.classList.remove('active-glow');
            shieldBtn.disabled = false;
            spaceship.classList.remove('shield-aura');
            bossHpWrapper.classList.remove('show');
            
            streakBadge.style.display = 'none';
            
            loadQ();
        }

        function startTimer() {
            timeLeft = maxTime;
            timerBar.style.width = '100%'; timerBar.classList.remove('timer-warning');
            clearInterval(timerInterval); clearInterval(tickInterval);
            
            if(audioCtx) tickInterval = setInterval(() => playSound('tick'), 1000);

            timerInterval = setInterval(() => {
                timeLeft--; timerBar.style.width = `${(timeLeft / maxTime) * 100}%`;
                if (timeLeft === 5) { timerBar.classList.add('timer-warning'); clearInterval(tickInterval); if(audioCtx) tickInterval = setInterval(() => playSound('tick'), 300); }
                if (timeLeft <= 0) { clearInterval(timerInterval); clearInterval(tickInterval); checkAns(-1, null); }
            }, 1000);
        }

        function loadQ() {
            if (currentQ >= quizData.length) return;
            
            document.body.classList.remove('critical-damage-fx');
            damageOverlay.classList.remove('active');
            asteroid.classList.remove('asteroid-explode', 'asteroid-crash');
            laser.classList.remove('laser-shoot', 'super-laser');
            starsBg.classList.remove('warp-speed');

            const current = quizData[currentQ];
            let isBossPhase = (currentQ >= quizData.length - 3);

            if (isBossPhase) {
                asteroid.innerText = "🛸";
                asteroid.classList.add('boss-ufo');
                bossHpWrapper.classList.add('show');
                let strikeNum = currentQ - (quizData.length - 3) + 1;
                qCounter.innerText = `معركة الزعيم: ضربة ${strikeNum} من 3`;
                
                diffBadge.innerHTML = `🔥 خطير`;
                diffBadge.style.color = "#ff2a2a";
                diffBadge.style.borderColor = "rgba(255, 42, 42, 0.5)";
                diffBadge.style.background = "rgba(255, 42, 42, 0.15)";
            } else {
                asteroid.innerText = "🪨"; 
                asteroid.classList.remove('boss-ufo');
                bossHpWrapper.classList.remove('show');
                qCounter.innerText = `الهدف ${currentQ + 1} / ${quizData.length - 3}`;
                
                let diffColor = current.difficulty === 'صعب' ? '🔴' : '🟡';
                diffBadge.innerHTML = `${diffColor} ${current.difficulty}`;
                diffBadge.style.color = "#fff";
                diffBadge.style.borderColor = "rgba(255, 255, 255, 0.2)";
                diffBadge.style.background = "rgba(255, 255, 255, 0.05)";
            }

            qText.innerText = current.q;
            
            optsContainer.innerHTML = '';
            expBox.style.display = 'none'; bubble.style.display = 'none'; bubble.style.opacity = '0';
            
            nextBtn.innerText = (currentQ === quizData.length - 1) ? "تدمير الزعيم وإنهاء المهمة 🚀" : "الهدف التالي 🌌";

            current.options.forEach((opt, idx) => {
                let btn = document.createElement('button'); btn.className = 'opt-btn'; btn.innerText = opt;
                btn.onclick = () => { initAudio(); checkAns(idx, btn); };
                optsContainer.appendChild(btn);
            });
            startTimer();
        }

        function checkAns(idx, btn) {
            clearInterval(timerInterval); clearInterval(tickInterval);
            
            const timeTaken = maxTime - timeLeft;
            const current = quizData[currentQ]; const btns = optsContainer.querySelectorAll('button');
            const isCorrect = (idx === current.correct); const isTimeout = (idx === -1);
            let isBossPhase = (currentQ >= quizData.length - 3);
            
            const isFast = (isCorrect && timeTaken <= 5 && !isTimeout);

            userAnswers.push({
                question: current.q, userPicked: isTimeout ? "لم يُجب (انتهى الوقت)" : current.options[idx],
                correctAnswer: current.options[current.correct], isCorrect: isCorrect, explanation: current.explanation
            });
            
            btns.forEach(b => b.disabled = true);
            btns[current.correct].style.background = 'rgba(0, 229, 255, 0.2)'; 
            btns[current.correct].style.borderColor = 'var(--laser-color)';

            bubble.style.display = 'block'; setTimeout(() => bubble.style.opacity = '1', 10);

            if (isCorrect) {
                streak++; 

                if (isFast) {
                    score += 2;
                    playSound('super-laser');
                    laser.classList.add('super-laser');
                    starsBg.classList.add('warp-speed');
                    resTitle.innerText = "🚀 سرعة الضوء! (+2 نقطة)"; resTitle.style.color = "#b700ff";
                    bubble.innerText = "ضربة خارقة! ⚡"; bubble.style.color = "#b700ff";
                } else {
                    score += 1;
                    playSound('laser'); 
                    resTitle.innerText = "🎯 تم التدمير (+1 نقطة)"; resTitle.style.color = "var(--laser-color)";
                    bubble.innerText = happyReplies[Math.floor(Math.random() * happyReplies.length)]; bubble.style.color = "#000";
                }
                
                laser.classList.add('laser-shoot');

                if (isBossPhase) {
                    currentBossHits++;
                    let hpPercentage = 100 - ((currentBossHits / 3) * 100);
                    bossHpFill.style.width = `${hpPercentage}%`;

                    if (currentBossHits === 3) {
                        setTimeout(() => {
                            asteroid.innerText = "💥";
                            asteroid.classList.remove('boss-ufo');
                            asteroid.classList.add('asteroid-explode');
                            bossHpWrapper.classList.remove('show');
                        }, 150);
                    } else {
                        setTimeout(() => {
                            playSound('bossHit');
                            asteroid.style.filter = "drop-shadow(0 0 50px #ff2a2a)";
                            setTimeout(() => asteroid.style.filter = "drop-shadow(0 0 25px rgba(255, 42, 42, 0.8))", 300);
                        }, 150);
                    }
                } else {
                    setTimeout(() => {
                        asteroid.innerText = "💥";
                        asteroid.classList.add('asteroid-explode');
                    }, 150);
                }

                if (streak >= 2) { streakBadge.style.display = 'block'; streakBadge.innerText = `🔥 كومبو: ${streak}`; }

            } else {
                if (isShieldActive) {
                    isShieldActive = false;
                    shieldBtn.innerText = "🛡️ الدرع تدمر!";
                    shieldBtn.classList.remove('active-glow');
                    playSound('shield');
                    
                    setTimeout(() => { spaceship.classList.remove('shield-aura'); }, 200);
                    
                    resTitle.innerText = "🛡️ الدرع الكهرومغناطيسي حماك!"; resTitle.style.color = "#00aaff";
                    bubble.innerText = "السفينة سليمة! 💨"; bubble.style.color = "#00aaff";
                    if(!isTimeout) { btn.style.background = 'rgba(255, 42, 42, 0.2)'; btn.style.borderColor = 'var(--damage-color)'; }
                } else {
                    playSound('explosion'); 
                    streak = 0; streakBadge.style.display = 'none';

                    if (!isBossPhase) {
                        asteroid.classList.add('asteroid-crash');
                    } else {
                        asteroid.style.transform = "scale(1.5) rotate(15deg)";
                        setTimeout(() => asteroid.style.transform = "", 300);
                    }
                    if (isTimeout) { 
                        resTitle.innerText = "⏰ تأخرت!"; 
                        bubble.innerText = "الوقت خلص! ⏰"; 
                    } else { 
                        resTitle.innerText = "⚠️ ضرر جسيم!"; 
                        bubble.innerText = sadReplies[Math.floor(Math.random() * sadReplies.length)]; 
                    }

                    document.body.classList.add('critical-damage-fx');
                    damageOverlay.classList.add('active');

                    if(!isTimeout) { btn.style.background = 'rgba(255, 42, 42, 0.2)'; btn.style.borderColor = 'var(--damage-color)'; }
                    resTitle.style.color = "var(--damage-color)"; bubble.style.color = "var(--damage-color)";
                }
            }

            expText.innerText = current.explanation; expBox.style.display = 'block';
            setTimeout(() => { uiContainer.scrollTo({ top: uiContainer.scrollHeight, behavior: 'smooth' }); }, 100);
        }

        function moveToNext() {
            currentQ++;
            if(currentQ < quizData.length) { loadQ(); } 
            else { showCompletion(); }
        }

        function showCompletion() {
            document.getElementById('quiz-content').style.display = 'none'; bubble.style.display = 'none'; 
            streakBadge.style.display = 'none'; document.body.classList.remove('critical-damage-fx');
            damageOverlay.classList.remove('active'); starsBg.classList.remove('warp-speed');
            spaceship.classList.remove('shield-aura'); bossHpWrapper.classList.remove('show');
            
            if (score > highScore) { highScore = score; localStorage.setItem('spaceQuizRPG', highScore); document.getElementById('highscore-badge').innerText = `🎖️ أفضل مهمة: ${highScore}`; }

            const praiseText = document.getElementById('final-praise'); const descText = document.getElementById('final-desc');
            const finalScoreObj = document.getElementById('final-score'); const trophy = document.getElementById('final-trophy');

            if (currentBossHits === 3 && score >= 6) {
                praiseText.innerText = "عقل المجرة الاقتصادي 🧠🌌";
                praiseText.style.color = "#ffd700";
                descText.innerText = "دمرت الزعيم وأثبتّ أنك فاهم مبادئ الإنتاج والتكاليف بشكل ممتاز.";
                trophy.innerText = "🛸";
                playSound('laser'); 
            } else if (currentBossHits === 3) {
                praiseText.innerText = "بطل الاقتصاد 🚀✨";
                praiseText.style.color = "var(--laser-color)";
                descText.innerText = "عاشت ايدك! فجرت سفينة الأم وحميت الكوكب بفضل إجاباتك.";
                trophy.innerText = "🎖️";
                playSound('laser');
            } else if (score >= 3) {
                praiseText.innerText = "مستكشف التكاليف 🔭🌠";
                praiseText.style.color = "#00ff9d";
                descText.innerText = "أدائك جيد، لكن تحتاج مراجعة بعض أساسيات منحنيات الناتج المتساوي.";
                trophy.innerText = "☄️";
            } else {
                praiseText.innerText = "خسارة اقتصادية 🕳️🌑";
                praiseText.style.color = "var(--damage-color)";
                descText.innerText = "الإيرادات ما غطت التكاليف والسفينة اتهشمت.. راجع الملزمة وارجع العب.";
                trophy.innerText = "☠️";
                playSound('explosion');
            }

            document.getElementById('final-score').innerText = `النقاط: ${score}`; 
            document.getElementById('completion-screen').style.display = 'block';
        }

        function showReview() {
            document.getElementById('completion-screen').style.display = 'none';
            const reviewList = document.getElementById('review-list'); reviewList.innerHTML = ''; 

            userAnswers.forEach((ans, index) => {
                let div = document.createElement('div'); div.className = 'review-item';
                let userStatus = ans.isCorrect ? `<span class="ans-correct">✔ ${ans.userPicked}</span>` : `<span class="ans-wrong">✖ ${ans.userPicked}</span> <br>(الصحيح: ${ans.correctAnswer})`;
                div.innerHTML = `<div class="review-q">س${index + 1}: ${ans.question}</div><div class="review-ans">إطلاقك: ${userStatus}</div><div class="review-exp">💡 <b>البيانات:</b> ${ans.explanation}</div>`;
                reviewList.appendChild(div);
            });
            document.getElementById('review-screen').style.display = 'block';
        }

        startFresh();
    </script>
</body>
</html>
